name: Weekly TikTok Genre Carousels

on:
  schedule:
    # Thursdays at 19:00 UTC (2:00 PM EST / 3:00 PM EDT)
    - cron: '0 19 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate, render, sync to dry-run-<date>, and preview without uploading to TikTok'
        type: boolean
        required: false
        default: false
      use_mock:
        description: 'Use sample/mock show data instead of live Supabase + listings feeds'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: 'weekly-tiktok-carousels'
  cancel-in-progress: false

jobs:
  carousels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compute run date and Pages folder
        id: meta
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          RUN_DATE="$(TZ=America/New_York date +%Y-%m-%d)"
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            PAGES_FOLDER="dry-run-${RUN_DATE}"
          else
            PAGES_FOLDER="${RUN_DATE}"
          fi
          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "pages_folder=${PAGES_FOLDER}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies and ensure Chromium is available
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/tiktok_carousels/requirements.txt
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            python3 -m playwright install chromium
          fi

      - name: Select upcoming NYC/NJ weekend shows
        env:
          RUN_DATE: ${{ steps.meta.outputs.run_date }}
          USE_MOCK: ${{ inputs.use_mock }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INCLUDE_LISTINGS_FEED: ${{ vars.INCLUDE_LISTINGS_FEED || 'true' }}
          LISTINGS_FEED_URL_TEMPLATE: ${{ secrets.LISTINGS_FEED_URL_TEMPLATE || vars.LISTINGS_FEED_URL_TEMPLATE }}
        run: |
          if [ "${USE_MOCK}" = "true" ]; then
            node tools/tiktok_carousels/select_shows.mjs --date "${RUN_DATE}" --mock
          else
            node tools/tiktok_carousels/select_shows.mjs --date "${RUN_DATE}"
          fi

      - name: Render 1080x1920 Setnik carousel JPEGs
        env:
          RUN_DATE: ${{ steps.meta.outputs.run_date }}
        run: |
          python3 tools/tiktok_carousels/render_carousels.py \
            --input "build/carousel_selected/${RUN_DATE}/selected.json"

      - name: Sync carousels into static/carousels and push to main
        env:
          RUN_DATE: ${{ steps.meta.outputs.run_date }}
          PAGES_FOLDER: ${{ steps.meta.outputs.pages_folder }}
          PUSH_TOKEN: ${{ secrets.PAGES_REPO_PAT || secrets.GH_SECRETS_PAT }}
        run: |
          python3 tools/tiktok_carousels/sync_pages_repo.py \
            --date "${RUN_DATE}" \
            --pages-folder "${PAGES_FOLDER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/carousels

          if git diff --cached --quiet; then
            echo "No changes under static/carousels; skipping commit and push."
            exit 0
          fi

          if [ -z "${PUSH_TOKEN}" ]; then
            echo "::error::Neither PAGES_REPO_PAT nor GH_SECRETS_PAT is set; cannot push static/carousels to main."
            exit 1
          fi

          git commit -m "chore(carousels): publish ${PAGES_FOLDER} slides"
          AUTH_HEADER="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push origin HEAD:main

      - name: Poll live Pages URLs and upload TikTok Creator Inbox drafts
        env:
          RUN_DATE: ${{ steps.meta.outputs.run_date }}
          PAGES_FOLDER: ${{ steps.meta.outputs.pages_folder }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/tiktok_new_refresh_token.txt
        run: |
          ARGS=(
            "--date" "${RUN_DATE}"
            "--pages-folder" "${PAGES_FOLDER}"
            "--token-out" "${TIKTOK_NEW_REFRESH_TOKEN_FILE}"
          )
          if [ "${INPUT_DRY_RUN}" = "true" ] || [ -z "${TIKTOK_CLIENT_KEY}" ] || [ -z "${TIKTOK_CLIENT_SECRET}" ] || [ -z "${TIKTOK_REFRESH_TOKEN}" ]; then
            ARGS+=("--dry-run")
          fi
          python3 tools/tiktok_carousels/publish_tiktok_drafts.py "${ARGS[@]}"

      - name: Rotate TIKTOK_REFRESH_TOKEN secret if refreshed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TIKTOK_NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/tiktok_new_refresh_token.txt
        run: |
          if [ ! -s "${TIKTOK_NEW_REFRESH_TOKEN_FILE}" ]; then
            echo "No rotated refresh token to persist."
            exit 0
          fi
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::TIKTOK_REFRESH_TOKEN rotated but GH_SECRETS_PAT is not set; cannot update repository secret."
            rm -f "${TIKTOK_NEW_REFRESH_TOKEN_FILE}"
            exit 0
          fi
          gh secret set TIKTOK_REFRESH_TOKEN --repo "${GITHUB_REPOSITORY}" < "${TIKTOK_NEW_REFRESH_TOKEN_FILE}"
          rm -f "${TIKTOK_NEW_REFRESH_TOKEN_FILE}"
          echo "Updated TIKTOK_REFRESH_TOKEN repository secret."

      - name: Publish inline carousel preview to Job Summary
        if: always()
        env:
          RUN_DATE: ${{ steps.meta.outputs.run_date }}
        run: |
          SUMMARY_FILE="build/carousel_ready/${RUN_DATE}/job_summary.md"
          if [ -f "${SUMMARY_FILE}" ]; then
            cat "${SUMMARY_FILE}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No job_summary.md was generated for ${RUN_DATE}." >> "$GITHUB_STEP_SUMMARY"
          fi

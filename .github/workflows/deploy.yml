name: Build and Deploy Setnik Web to GitHub Pages

on:
  schedule:
    # Daily at 11:00 UTC (6:00 AM EST / 7:00 AM EDT)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      metros:
        description: 'Comma-separated metro IDs (e.g. nyc,la or all). Leave blank for default.'
        required: false
        default: ''
      use_mock:
        description: 'Run with mock/sample data instead of live Supabase + listings feeds'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run automated SEO & schema validation tests
        run: npm test

      - name: Build static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          SETNIK_METROS: ${{ github.event.inputs.metros || vars.SETNIK_METROS || 'nyc,la,chi,sf,tor,mtl,van,bos,dc,phl' }}
          INCLUDE_LISTINGS_FEED: ${{ vars.INCLUDE_LISTINGS_FEED || 'true' }}
          LISTINGS_FEED_URL_TEMPLATE: ${{ secrets.LISTINGS_FEED_URL_TEMPLATE || vars.LISTINGS_FEED_URL_TEMPLATE }}
        run: |
          if [ "${{ github.event.inputs.use_mock }}" = "true" ]; then
            node src/build.mjs --mock --out dist
          else
            node src/build.mjs --out dist
          fi

      - name: Verify required SEO artifacts exist
        run: |
          test -f dist/.nojekyll
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/sitemap.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

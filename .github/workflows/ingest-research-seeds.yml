name: Ingest Creator Search Insights Seeds

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: 'ingest-research-seeds'
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Only run on issues labeled `research-seed` and authored by repo owner/members/collaborators
    if: >-
      contains(github.event.issue.labels.*.name, 'research-seed') &&
      (
        (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: python3 -m pip install --upgrade pip && python3 -m pip install "httpx>=0.27.0,<1.0.0"

      - name: Extract seeds via Gemini Vision
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          SOURCE_URL: ${{ github.event.comment.html_url || github.event.issue.html_url }}
        run: |
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            printf '%s' "${COMMENT_BODY}" > "${RUNNER_TEMP}/seed_body.md"
          else
            printf '%s' "${ISSUE_BODY}" > "${RUNNER_TEMP}/seed_body.md"
          fi

          python3 tools/tiktok_growth/ingest_seeds.py \
            --body-file "${RUNNER_TEMP}/seed_body.md" \
            --source-url "${SOURCE_URL}" \
            --reply-out "${RUNNER_TEMP}/seed_reply.md"

      - name: Commit updated research_seeds.json to main
        env:
          PUSH_TOKEN: ${{ secrets.PAGES_REPO_PAT || secrets.GH_SECRETS_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tiktok_growth/research_seeds.json

          if git diff --cached --quiet; then
            echo "No new seeds to commit."
            exit 0
          fi

          if [ -z "${PUSH_TOKEN}" ]; then
            echo "::error::Neither PAGES_REPO_PAT nor GH_SECRETS_PAT is set; cannot push research_seeds.json."
            exit 1
          fi

          git commit -m "chore(growth): ingest Creator Search Insights seeds from #${ISSUE_NUMBER}"
          AUTH_HEADER="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push origin HEAD:main

      - name: Reply on issue with extracted seeds
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -s "${RUNNER_TEMP}/seed_reply.md" ]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body-file "${RUNNER_TEMP}/seed_reply.md"
          fi
